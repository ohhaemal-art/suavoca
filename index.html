body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,
    "Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--lemon) 30%, transparent) 0 60px, transparent 61px),
    radial-gradient(circle at 88% 18%, color-mix(in srgb, var(--sky) 28%, transparent) 0 70px, transparent 71px),
    radial-gradient(circle at 78% 92%, color-mix(in srgb, var(--mint) 26%, transparent) 0 80px, transparent 81px),
    radial-gradient(circle at 8% 78%, color-mix(in srgb, var(--grape) 24%, transparent) 0 64px, transparent 65px);
  filter:blur(28px);opacity:.75}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1,h2,h3{margin:0}
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:block;width:100%;padding:17px;border-radius:var(--r);background:var(--btn);color:var(--btn-fg);
  font-weight:800;font-size:18px;box-shadow:var(--shadow);transition:transform .1s;
  text-shadow:none}
.btn:active{transform:translateY(2px) scale(.99)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:800;font-size:16px;
  text-shadow:none}
.btn.sm{padding:12px;font-size:15px;border-radius:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.hide{display:none!important}

/* ---- topbar ---- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font-weight:900;font-size:19px;letter-spacing:-.4px}
.logo span{color:var(--honey-d)}
.logo{font-size:20px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--card);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow)}

/* ---- home ---- */
.dday{background:var(--hero);color:var(--hero-fg);
  border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dday .mascot{position:absolute;right:12px;bottom:-6px;opacity:.95;filter:drop-shadow(0 2px 5px rgba(20,70,100,.16))}
.dday b{font-size:34px;letter-spacing:-1px;display:block;line-height:1.1}
.dday .lbl{font-size:13px;font-weight:800;opacity:.85}
.dday .sub2{font-size:12px;opacity:.85;margin-top:6px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;
  box-shadow:var(--shadow)}
.stat b{display:block;font-size:21px;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--sub);font-weight:600}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend em{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.seg{display:flex;gap:6px;margin:12px 0}
.seg.pages{flex-wrap:wrap}
.seg.pages button{flex:1 1 auto;min-width:52px;padding:9px 6px;font-size:12.5px}
.seg button{flex:1;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);
  font-size:13px;font-weight:800;color:var(--sub)}
.seg button.on{background:var(--btn);border-color:transparent;color:var(--btn-fg)}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* ---- session ---- */
/* 학습 중에는 화면을 고정하고 스크롤 없이 한 화면에 담는다 */
.wrap.sessview{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;
  overflow:hidden;padding-bottom:0}
.qarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.fbbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:2px solid var(--line);box-shadow:0 -8px 24px rgba(30,90,130,.14);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  max-height:56dvh;overflow-y:auto;animation:slideUp .2s ease-out}
.fbbar:empty{display:none}
.card.answered .spk,.card.answered .qhint,.card.answered .qbox .muted,
.card.answered .qbox .qsub{display:none}
.card.answered .qbox{min-height:0}
.card.answered input.ans{margin-top:2px}
.fbbar .inner{max-width:488px;margin:0 auto}
@keyframes slideUp{from{transform:translateY(101%)}to{transform:translateY(0)}}
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn{flex:1}
.btnrow .btn.mini{flex:0 0 auto;padding:12px 16px;font-size:15px}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--prog);transition:width .3s}
.hearts{font-size:15px;letter-spacing:1px}
.qtag{display:inline-block;font-size:12px;font-weight:800;padding:6px 13px;border-radius:99px;
  background:var(--line);color:var(--honey-d);margin-bottom:14px}
.qbox{min-height:132px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.qword{font-size:34px;font-weight:800;letter-spacing:-.5px;word-break:break-word}
.qmean{font-size:23px;font-weight:800;line-height:1.35}
.qhint{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:25px;font-weight:800;
  letter-spacing:0;color:var(--honey-d);margin:12px 0 4px;
  white-space:nowrap;overflow:hidden;line-height:1.25}
.qsub{font-size:15px;color:var(--sub);margin-top:8px}
.qhint .ch{display:inline-block;width:.72em;margin:0 .09em;font-style:normal;text-align:center}
.qhint .ch.bl::before{content:"\00a0"}
.qhint .ch.bl{width:.52em;margin:0 .19em;border-bottom:.13em solid currentColor;line-height:1}
.spk{width:80px;height:80px;border-radius:50%;background:linear-gradient(140deg,#3fa9d8,#3bbcab);
  color:#fff;font-size:33px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;
  box-shadow:var(--shadow)}
.spk:active{transform:scale(.95)}
.opts{display:grid;gap:7px;margin-top:12px}
.opt{padding:14px 15px;border-radius:16px;border:2px solid var(--line);background:var(--card);
  text-align:left;font-size:16px;font-weight:700;transition:.12s;box-shadow:var(--shadow)}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:800}
.opt.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
input.ans{width:100%;padding:14px 12px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:23px;font-weight:700;text-align:center;letter-spacing:2px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;text-overflow:clip}
input.ans:focus{outline:none;border-color:var(--honey)}
.fb{padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.55;border:2px solid currentColor}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ng{background:var(--ng-bg);color:var(--ng)}
.fb b{font-size:19px;letter-spacing:1px;font-family:ui-monospace,Menlo,monospace;
  white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;vertical-align:bottom}
.diff{white-space:nowrap;overflow:hidden}
.syl{white-space:nowrap;display:inline-block}
.diff span{font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:800;letter-spacing:2px}
.diff .g{color:var(--ok)} .diff .b{color:var(--ng);text-decoration:underline wavy}
.timer{font-size:13px;font-weight:800;color:var(--ng)}
.exbox{margin-top:8px;padding:9px 11px;border-radius:13px;background:var(--bg);border:1.5px solid var(--line)}
.exen{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.5}
.exen .hl{display:inline;font-family:inherit;font-size:inherit;letter-spacing:normal;
  white-space:normal;overflow:visible;max-width:none;color:var(--hl-ink);background:var(--hl-bg);
  border-radius:5px;padding:1px 4px;margin:0 -1px;font-weight:800;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.exko{font-size:15px;color:var(--sub);margin-top:4px;line-height:1.45}

/* ---- lists ---- */
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .w{font-weight:800;font-size:16px}
.item .m{font-size:12px;color:var(--sub);margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.mini{width:36px;height:36px;border-radius:12px;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:15px;flex:none}
.srch{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);
  font-size:13px;font-weight:800;color:var(--sub)}
.chip.on{background:var(--btn);border-color:transparent;color:var(--btn-fg)}
.donut{display:block;margin:0 auto}
label.set{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
label.set select,label.set input[type=number]{margin-left:auto;padding:8px 10px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
label.set input[type=checkbox]{margin-left:auto;width:22px;height:22px;accent-color:var(--honey)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);
  color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:99;
  box-shadow:0 4px 18px rgba(0,0,0,.25)}
.mascot-img{display:block;margin:0 auto}
.smile{display:inline-block;vertical-align:middle;flex:none;height:auto}
.logofull{display:inline-block;vertical-align:middle;height:auto}
.brand{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:26px;
  background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow)}
.stamp{position:absolute;top:12px;right:12px;transform:rotate(11deg)}
@keyframes bounceIn{0%{transform:scale(.4) rotate(-16deg);opacity:0}
  60%{transform:scale(1.12) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(11deg)}}
.stamp{animation:bounceIn .42s cubic-bezier(.2,1.4,.5,1) both}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-11px)}50%{transform:translateY(0)}
  62%{transform:translateY(-5px)}75%{transform:translateY(0)}}
.mascot-img.hop{animation:hop 2.1s ease-in-out infinite}
.dday .mascot{animation:hop 3.4s ease-in-out infinite}
.card.warn{margin-top:12px;border-color:#f0b429;background:#fffaf0;color:#7a4a00;font-size:14px;line-height:1.6}
.card.warn b{color:#8a4b00}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(20,60,85,.35);display:flex;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
textarea.dump{width:100%;height:170px;border:2px solid var(--line);border-radius:14px;padding:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);color:var(--ink);
  resize:none;-webkit-user-select:text;user-select:text}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}
.dday b,.stat b,.timer,.item .w{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--honey-d);outline-offset:2px}
.card,.qbox{overflow-x:auto}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

function todayStr(d){ d=d||new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

/* 저장소: localStorage → sessionStorage → 메모리 순으로 자동 대체.
   아이폰에서 파일(file://)로 열면 Safari가 localStorage를 막는 경우가 있어 필요하다. */
let store=null, storeKind="none", mem={};
function probe(s){
  try{ const k="__t"+KEY; s.setItem(k,"1"); const v=s.getItem(k); s.removeItem(k); return v==="1"; }
  catch(e){ return false; }
}
function pickStore(){
  try{ if(window.localStorage && probe(window.localStorage)){ store=window.localStorage; storeKind="local"; return; } }catch(e){}
  try{ if(window.sessionStorage && probe(window.sessionStorage)){ store=window.sessionStorage; storeKind="session"; return; } }catch(e){}
  store={ getItem:k=>(k in mem?mem[k]:null), setItem:(k,v)=>{mem[k]=v;}, removeItem:k=>{delete mem[k];} };
  storeKind="memory";
}
function load(){ pickStore();
  try{ const r=store.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r)); }catch(e){} }
function save(){ try{ store.setItem(KEY,JSON.stringify(S)); }catch(e){ storeKind="memory"; } }
function storeOK(){ return storeKind==="local"; }
function st(no){ return S.p[no] || (S.p[no]={box:0,ok:0,ng:0,miss:"",due:todayStr()}); }

let audioCache={}, curAudio=null, voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices()||[];
  voice = vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Ava|Allison/i.test(v.name))
       || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(w,no){
  try{ if(curAudio){curAudio.pause();curAudio=null;} }catch(e){}
  if(AUD[no]){
    let a=audioCache[no]; if(!a){ a=new Audio("data:audio/mpeg;base64,"+AUD[no]); audioCache[no]=a; }
    a.currentTime=0; a.playbackRate=S.set.rate<.8?.8:1; curAudio=a; a.play().catch(()=>ttsSay(w));
  } else ttsSay(w);
}
function ttsSay(w){ if(!window.speechSynthesis) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w);
  u.lang="en-US"; u.rate=S.set.rate; if(voice)u.voice=voice; speechSynthesis.speak(u); }
let actx=null;
function ac(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function tone(f,at,dur,vol,type){
  const c=ac(); if(!c) return;
  const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+.03);
}

  if(!S.set.sound) return;
  if(ok){                                   // 도-미-솔-도 반짝이는 아르페지오
    [[523.25,0],[659.25,.075],[783.99,.15],[1046.50,.225]].forEach(([f,t],i)=>{

    });

  } else {                                  // 부드럽게 내려가는 두 음
    tone(392.00,0,.20,.075,"sine");
    tone(311.13,.12,.28,.065,"sine");

}

const POS={"명":"명사","동":"동사","형":"형용사","부":"부사","전":"전치사","접":"접속사","대":"대명사"};
function posK(p){ return "["+String(p).split("/").map(x=>POS[x]||x).join("\u00b7")+"]"; }
function h(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function seed(n){ let x=Math.sin(n*9301+49297)*233280; return x-Math.floor(x); }
function mask(word,keepRatio,no){
  const L=word.split(""); const idx=L.map((c,i)=>i).filter(i=>/[a-z]/i.test(L[i]));
  const keep=Math.round(idx.length*keepRatio);
  const order=idx.map(i=>({i,r:seed(no*31+i)})).sort((a,b)=>a.r-b.r).map(o=>o.i);
  const shown=new Set(order.slice(0,keep));
  return L.map((c,i)=> !/[a-z]/i.test(c) ? c : (shown.has(i)? c : "_")).join("");
}
function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
function diffHtml(inp,ans){
  const a=inp.split(""), b=ans.split(""), n=Math.max(a.length,b.length); let o="";
  for(let i=0;i<n;i++){ const c=a[i]||"·"; o+= (a[i]&&a[i].toLowerCase()===(b[i]||"").toLowerCase())
      ? '<span class="g">'+h(c)+'</span>' : '<span class="b">'+h(c)+'</span>'; }
  return o;
}

function shrinkToFit(el,maxPx,minPx){
  if(!el) return;
  let size=maxPx;
  el.style.fontSize=size+"px";
  // 레이아웃이 잡힌 뒤 측정 (한 번에 여러 px씩 줄여 빠르게 수렴)
  let guard=0;
  while(size>minPx && el.scrollWidth>el.clientWidth+1 && guard++<40){
    size-=Math.max(1, Math.round((size-minPx)*0.12));
    el.style.fontSize=size+"px";
  }
  return size;
}
function fitAnsInput(){
  const inp=document.getElementById("ans"); if(!inp) return;
  const q=Q[qi]; const len=Math.max((inp.value||"").length, q? q.w.word.length:0, 1);
  const avail=inp.clientWidth-26;
  let size=23;
  while(size>13 && len*(size*0.615+2)>avail) size-=1;
  inp.style.fontSize=size+"px";
  if(size<=15) inp.style.letterSpacing="1px";
}

  const lw=w.toLowerCase();
  if(lw==="oneself") return ["\\b(?:one|him|her|it|your|my|our|them)sel(?:f|ves)\\b"];
  if(lw==="one's")   return ["\\b(?:one|his|her|its|your|my|our|their)\\b"];
  const e=esc(w), L=w.length, pats=[
    "\\b"+e+"\\b",
    "\\b"+e+"(?:s|es|d|ed|ing|er|est)\\b"
  ];
  if(/e$/i.test(w))  pats.push("\\b"+esc(w.slice(0,-1))+"(?:ing|ed|es)\\b");
  if(/y$/i.test(w))  pats.push("\\b"+esc(w.slice(0,-1))+"(?:ies|ied)\\b");
  if(L>2) pats.push("\\b"+e+esc(w.slice(-1))+"(?:ing|ed)\\b");
  if(IRREG[lw]) pats.push("\\b"+esc(IRREG[lw])+"\\b");
  if(L>=6) pats.push("\\b"+esc(w.slice(0,L-2))+"[a-z]{0,4}\\b");
  return pats;
}
function markRanges(sent, w){
  for(const p of wordPatterns(w)){
    let m=null;
    try{ m=new RegExp(p,"i").exec(sent); }catch(e){ m=null; }
    if(m) return [[m.index, m.index+m[0].length]];
  }
  return [];
}
function hlEx(w){
  const sent=w.ex||"";
  const raw=w.word.replace(/[~]/g,"").replace(/\b[AB]\b/g,"").replace(/\bv\b/g,"").trim();
  const all=raw.split(/\s+/).filter(Boolean);
  let parts=all.filter(t=>!EX_STOP.has(t.toLowerCase()));
  if(!parts.length) parts=all;                       // 전부 기능어면(but, by, up to) 그대로 찾는다
  let ranges=[];
  for(const t of parts) ranges=ranges.concat(markRanges(sent,t));
  if(!ranges.length) return h(sent);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const r of ranges){
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]+2) last[1]=Math.max(last[1],r[1]); else merged.push(r.slice());
  }
  let out="", pos=0;
  for(const [a,b] of merged){
    out+=h(sent.slice(pos,a))+'<b class="hl">'+h(sent.slice(a,b))+'</b>';
    pos=b;
  }
  return out+h(sent.slice(pos));
}
function hintHTML(str){
  return str.split("").map(c=> c==="_" ? '<i class="ch bl"></i>'
    : '<i class="ch">'+h(c)+'</i>').join("");
}
function toast(m){ const d=document.createElement("div"); d.className="toast"; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

/* ---------- scope / stats ---------- */
let scope="all", mode="normal";
function pool(){ return scope==="all"? WORDS : WORDS.filter(w=>w.page===+scope); }
function counts(){ const p=pool(); let m=0,l=0,n=0;
  p.forEach(w=>{ const b=st(w.no).box; if(b>=5)m++; else if(b>0)l++; else n++; });
  return {m,l,n,t:p.length}; }
function dueList(){ const t=todayStr();
  return pool().filter(w=>{const s=st(w.no); return s.box>0 && s.box<5 && s.due<=t;}); }
function masteredDue(){ const t=todayStr();
  return pool().filter(w=>{const s=st(w.no); return s.box>=5 && s.due<=t;}); }

/* ---------- session ---------- */
let Q=[], qi=0, hearts=5, sess=null, tmr=null, tleft=0, replays=0;
const LADDER={mcW2M:"mcM2W", mcM2W:"mcListen", mcListen:"fill7", fill7:null};
const LADDER_PH={mcW2M:"mcM2W", mcM2W:"mcListen", mcListen:null};   // 구·숙어는 쓰기 단계 없음
const isPhrase=w=>!!w.phrase;
const ISMC=t=>t==="mcW2M"||t==="mcM2W"||t==="mcListen";
function qtypeFor(box,w){
  if(w && isPhrase(w)) return box<=0 ? "mcW2M" : "mcListen";   // 구·숙어는 고르기만
  if(mode==="exam") return "spell";
  if(box<=0) return "mcW2M"; if(box===1) return "fill4"; return "spell"; }
function enqueue(q){ Q.splice(Math.min(qi+3,Q.length),0,q); }
function startSession(){
  const goal=S.set.goal, today=todayStr();
  const fresh1=w=>st(w.no).seen!==today;          // 오늘 아직 안 나온 것
  const cost=w=>isPhrase(w)?3:4;                  // 새 단어 1개가 차지하는 문항 수

  // ① 복습 만기 — 오늘 아직 안 본 것 먼저
  const due=dueList().sort((a,b)=>st(a.no).box-st(b.no).box);
  let list=due.filter(fresh1);

  // ② 오늘 틀려서 다시 걸린 단어는 세션의 1/3까지만 (새 단어 자리를 뺏지 않도록)
  const again=due.filter(w=>!fresh1(w));
  const cap=Math.max(2, Math.floor(goal/3));
  if(list.length<goal) list=list.concat(again.slice(0, Math.min(cap, goal-list.length)));

  // ③ 마스터 단어 점검
  if(list.length<goal)
    list=list.concat(masteredDue().filter(fresh1).slice(0, goal-list.length));

  // ④ 새 단어 — 오늘 안 본 것부터. 다 떨어지면 오늘 본 것이라도 채운다
  if(list.length<goal){
    const room=goal-list.length;
    const all=pool().filter(w=>st(w.no).box===0);
    const pick=arr=>{ const out=[]; let used=0;
      for(const w of arr){ const c=cost(w); if(used+c>room && out.length) break; out.push(w); used+=c; }
      return out; };
    let add=pick(all.filter(fresh1));
    if(!add.length) add=pick(all);
    list=list.concat(add);
  }

  if(!list.length){ toast("오늘 공부할 단어를 다 끝냈어요! 🎉"); return; }
  list.forEach(w=>{ st(w.no).seen=today; });      // 이번 세션에 나온 것으로 표시
  save();
  Q=list.map(w=>({w, type:qtypeFor(st(w.no).box, w), done:false}));
  qi=0; hearts=maxHearts(); replays=0;
  sess={n:Q.length, ok:0, ng:0, xp:0, wrong:[], learned:0};
  view="sess"; render();
}
function maxHearts(){ return S.set.hearts==null ? 5 : S.set.hearts; }
function distractors(w,n,kind){
  let bag;
  if(kind==="sound"){                       // 듣기 문제 → 첫 글자·길이가 비슷한 단어
    const near=WORDS.filter(x=>x.no!==w.no &&
      (x.word[0]===w.word[0] || Math.abs(x.word.length-w.word.length)<=1));
    bag = near.length>=n ? near : WORDS.filter(x=>x.no!==w.no);
  } else {                                  // 뜻 문제 → 같은 품사
    const same=WORDS.filter(x=>x.no!==w.no && x.pos===w.pos);
    bag = same.length>=n ? same : WORDS.filter(x=>x.no!==w.no);
  }
  bag=bag.slice();
  const out=[]; let g=w.no*7+(kind==="sound"?13:0);
  while(out.length<n && bag.length){ g=(g*1103515245+12345)%2147483647;
    out.push(bag.splice(g%bag.length,1)[0]); }
  return out;
}
function grade(correct){
  const q=Q[qi], w=q.w, s=st(w.no), t=q.type;
  if(correct){
    s.ok++; sess.ok++;
    const gain = t==="spell"?20 : ISMC(t)?10 : 15; sess.xp+=gain; S.xp+=gain;
    if(q.intro || t==="mcW2M"){         // 새 단어: 같은 세션에서 단계를 차례로
      const nxt=(isPhrase(w)?LADDER_PH:LADDER)[t];
      if(nxt) enqueue({w, type:nxt, intro:true});
      else { s.box=1; s.due=addDays(IVL[1]);     // 사다리 통과 → 박스 1 진입
             if(!s.first){ s.first=todayStr(); S.hist2=S.hist2||{};
               S.hist2[s.first]=(S.hist2[s.first]||0)+1; }
             if(sess) sess.learned=(sess.learned||0)+1; }
    } else {
      s.box=Math.min(5,s.box+1);
      s.due=addDays(IVL[Math.min(s.box,5)]);
    }
  } else {
    s.ng++; sess.ng++; hearts--;
    if(!q.intro && s.box>0){ s.box=1; s.due=todayStr(); }
    if(!sess.wrong.find(x=>x.no===w.no)) sess.wrong.push(w);
    enqueue({w, type:t, intro:q.intro, retry:true});
  }
  save(); updateHUD();
}
function heartStr(){
  const m=maxHearts(); if(m<=0) return "";
  const h=Math.max(0,hearts); return "❤️".repeat(h)+"🤍".repeat(m-h);
}
function updateHUD(){
  const hv=document.querySelector(".hearts");
  if(hv) hv.textContent=heartStr();
  const pb=document.querySelector(".prog i");
  if(pb) pb.style.width=((qi+1)/Q.length*100)+"%";
}
function next(){ qi++; replays=0;
  if((maxHearts()>0 && hearts<=0) || qi>=Q.length) finish(); else render(); }
function finish(){
  clearInterval(tmr);
  const t=todayStr();
  if(S.last!==t){ S.streak = (S.last===addDays(-1))? S.streak+1 : 1; S.last=t; }
  S.hist[t]=(S.hist[t]||0)+sess.ok+sess.ng;
  save(); view="result"; render();
}

function vSess(){
  const q=Q[qi], w=q.w, s=st(w.no);

  const P=isPhrase(w);
  const tag={mcW2M: P?"① 표현 보고 뜻 고르기 👀":"① 단어 보고 뜻 고르기 👀",
             mcM2W: P?"② 뜻 보고 표현 고르기 🔤":"② 뜻 보고 단어 고르기 🔤",
             mcListen: P?"③ 듣고 표현 고르기 🎧":"③ 듣고 단어 고르기 🎧",
             fill7:"④ 빈칸 채우기 ✏️", fill4:"④ 빈칸 채우기 (조금 어려워요) ✏️",

        h(showMeaningOpts? o.meaning : o.word)+'</button>').join("")+'</div>';
  } else {
    const keep = q.type==="fill7"? .7 : q.type==="fill4"? .45 : 0;

      '<button class="btn sec mini" onclick="say(\''+w.word+'\','+w.no+')">🔊</button>'+
      '<button class="btn" onclick="next()">다음</button>'+
    '</div></div>';
  requestAnimationFrame(()=>shrinkToFit(document.querySelector(".diff"),21,11));
  if(!ok) say(w.word,w.no);
}

function vResult(){
  const r=sess, rate=r.ok+r.ng? Math.round(r.ok/(r.ok+r.ng)*100):0;
  const R=54, C=2*Math.PI*R, off=C*(1-rate/100);
  return topbar("오늘 끝! 🎉",true)+
  '<div class="card" style="text-align:center;position:relative">'+
    (rate>=80? '<span class="stamp">'+logoFull(76)+'</span>' : '')+
    '<div>'+mascot(72,rate>=80?"hop":"")+'</div>'+
    '<svg class="donut" width="140" height="140" viewBox="0 0 140 140">'+
      '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="14"/>'+
      '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--honey)" stroke-width="14" stroke-linecap="round"'+
        ' stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 70 70)"/>'+
      '<text x="70" y="78" text-anchor="middle" font-size="30" font-weight="800" fill="currentColor">'+rate+'%</text>'+
    '</svg>'+
    '<div style="margin-top:6px;font-size:15px"><b>+'+r.xp+' XP</b> · 맞음 '+r.ok+' · 틀림 '+r.ng+'</div>'+
    (r.learned? '<div class="muted" style="margin-top:4px">새로 배운 단어 '+r.learned+'개 🌱</div>':'')+
    (maxHearts()>0&&hearts<=0?'<div class="muted" style="margin-top:6px">하트를 다 써서 여기까지예요</div>':'')+
    '<div class="muted" style="margin-top:4px">🔥 연속 '+S.streak+'일</div></div>'+
  (r.wrong.length? '<div class="card" style="margin-top:12px"><h3 style="font-size:15px;margin-bottom:6px">오늘 틀린 단어</h3>'+
    r.wrong.map(w=>'<div class="item"><button class="mini" onclick="say(\''+w.word+'\','+w.no+')">🔊</button>'+
      '<div><div class="w">'+h(w.word)+'</div><div class="m">'+h(w.meaning)+'</div></div></div>').join("")+'</div>' : '')+
  '<div style="height:12px"></div>'+
  (r.wrong.length?'<button class="btn" onclick="retryWrong()">틀린 것만 다시 풀기 💪</button><div style="height:8px"></div>':'')+
  '<button class="btn'+(r.wrong.length?' sec':'')+'" onclick="startSession()">새 단어로 더 풀기 ▶</button>'+
  '<div style="height:8px"></div>'+
  '<button class="btn sec" onclick="go(\'home\')">홈으로</button>';
}
function retryWrong(){ const ws=sess.wrong.slice();
  Q=ws.map(w=>({w,type:qtypeFor(st(w.no).box,w),done:false})); qi=0; hearts=maxHearts();
  sess={n:Q.length,ok:0,ng:0,xp:0,wrong:[],learned:0}; view="sess"; render(); }

function vWrong(){
  const ws=WORDS.filter(w=>st(w.no).ng>0).sort((a,b)=>{
    const A=st(a.no),B=st(b.no); return (B.ng-B.ok)-(A.ng-A.ok) || B.ng-A.ng; });
  return topbar("틀린 단어",true)+
    '<div class="muted" style="margin-bottom:10px">자주 틀리는 순서예요. 대회 2주 전부터는 이 화면만 봐도 좋아요!</div>'+
    (ws.length? '<div class="card">'+ws.map(w=>{const s=st(w.no);
      return '<div class="item"><button class="mini" onclick="say(\''+w.word+'\','+w.no+')">🔊</button>'+
        '<div style="flex:1"><div class="w">'+h(w.word)+'</div>'+
        '<div class="m">'+h(w.meaning)+(s.miss?' · 쓴 답: <b style="color:var(--ng)">'+h(s.miss)+'</b>':'')+'</div></div>'+
        '<div class="muted">✕'+s.ng+'</div></div>';}).join("")+'</div>'
      : '<div class="card muted">아직 틀린 단어가 없어요! 잘하고 있어요 🌟</div>');
}

function vList(){
  let ws=pool();
  if(listFilter==="new") ws=ws.filter(w=>st(w.no).box===0);
  if(listFilter==="learn") ws=ws.filter(w=>{const b=st(w.no).box;return b>0&&b<5;});
  if(listFilter==="master") ws=ws.filter(w=>st(w.no).box>=5);
  if(listQ) ws=ws.filter(w=>w.word.includes(listQ.toLowerCase())||w.meaning.includes(listQ));
  const col=b=> b>=5?"var(--ok)": b>0?"var(--honey)":"var(--line)";
  return topbar("단어 모음",true)+
    '<input class="srch" placeholder="단어 또는 뜻 검색" value="'+h(listQ)+'" oninput="listQ=this.value;render()">'+
    '<div class="chips">'+[["all","전체"],["new","미시작"],["learn","학습중"],["master","마스터"]].map(([v,l])=>
      '<button class="chip '+(listFilter===v?'on':'')+'" onclick="listFilter=\''+v+'\';render()">'+l+'</button>').join("")+'</div>'+
    '<div class="muted" style="margin-bottom:8px">'+ws.length+'개</div>'+
    '<div class="card">'+(ws.length? ws.map(w=>{const s=st(w.no);
      return '<div class="item">'+
        (s.box>=5? smile(30) : '<div class="dot" style="background:'+col(s.box)+'"></div>')+
        '<div style="flex:1"><div class="w">'+w.no+'. '+h(w.word)+'</div>'+
        '<div class="m">'+posK(w.pos)+' '+h(w.meaning)+'</div></div>'+
        '<button class="mini" onclick="say(\''+w.word+'\','+w.no+')">🔊</button></div>';}).join("")
      : '<div class="muted">결과가 없습니다.</div>')+'</div>';
}

function vSet(){
  const days=[...Array(7)].map((_,i)=>addDays(-6+i));
  const mx=Math.max(1,...days.map(d=>S.hist[d]||0));
  return topbar("설정",true)+
  '<div class="card"><h3 style="font-size:15px;margin-bottom:10px">최근 7일 공부한 양</h3>'+
    '<div class="row" style="align-items:flex-end;height:70px;gap:6px">'+
      days.map(d=>{const v=S.hist[d]||0; return '<div style="flex:1;text-align:center">'+
        '<div style="height:'+(v/mx*54)+'px;background:var(--honey);border-radius:5px 5px 0 0;min-height:2px"></div>'+
        '<div style="font-size:10px;color:var(--sub);margin-top:3px">'+d.slice(8)+'</div></div>';}).join("")+
    '</div><div class="muted" style="margin-top:8px">총 XP '+S.xp+'</div></div>'+
  '<div class="card" style="margin-top:12px">'+
    '<label class="set">하루에 풀 문제 수<select onchange="S.set.goal=+this.value;save()">'+
      [12,16,20,24,32,40].map(v=>'<option value="'+v+'" '+(S.set.goal===v?'selected':'')+'>'+v+'문제</option>').join("")+'</select></label>'+
    '<label class="set">받아쓰기할 때 뜻 보여주기<input type="checkbox" '+(S.set.showMean?'checked':'')+
      ' onchange="S.set.showMean=this.checked;save()"></label>'+
    '<label class="set">하트 개수<select onchange="S.set.hearts=+this.value;save()">'+
      [[3,"3개 (엄격)"],[5,"5개 (기본)"],[8,"8개 (넉넉)"],[0,"제한 없음"]].map(([v,l])=>
        '<option value="'+v+'" '+(maxHearts()===v?'selected':'')+'>'+l+'</option>').join("")+'</select></label>'+
    '<label class="set">효과음<input type="checkbox" '+(S.set.sound?'checked':'')+
      ' onchange="S.set.sound=this.checked;save()"></label>'+
    '<label class="set">TTS 속도<select onchange="S.set.rate=+this.value;save()">'+
      [[.7,"느리게"],[.85,"보통"],[1,"빠르게"]].map(([v,l])=>'<option value="'+v+'" '+(S.set.rate===v?'selected':'')+'>'+l+'</option>').join("")+'</select></label>'+
  '</div>'+
  '<div class="card" style="margin-top:12px"><h3 style="font-size:15px;margin-bottom:8px">진도 백업</h3>'+
    '<div class="muted" style="margin-bottom:10px">'+
      (storeOK()? '✅ 이 기기에 진도가 자동으로 저장되고 있어요.'
                : '⚠️ 자동 저장이 막혀 있어요. 공부를 마치면 아래 <b>진도 저장하기</b>를 꼭 눌러 주세요.')+'</div>'+
    '<button class="btn sm" onclick="exportP()">📥 진도 저장하기 (파일로 내려받기)</button><div style="height:8px"></div>'+
    '<button class="btn sec sm" onclick="document.getElementById(\'impf\').click()">📤 진도 불러오기 (파일 선택)</button>'+
    '<input type="file" id="impf" accept=".json,application/json" style="display:none" onchange="importFile(this)">'+
    '<div style="height:8px"></div>'+
    '<button class="btn sec sm" onclick="copyP()">진도 글자로 복사하기</button><div style="height:8px"></div>'+
    '<button class="btn sec sm" onclick="pasteP()">복사한 글자로 되돌리기</button><div style="height:8px"></div>'+
    '<button class="btn sec sm" style="color:var(--ng)" onclick="if(confirm(\'모든 학습 기록을 지울까요?\')){localStorage.removeItem(KEY);location.reload()}">진도 초기화</button></div>'+
  '<div class="muted" style="margin-top:14px;text-align:center">공식 음원 '+Object.keys(AUD).length+'개 내장 · 나머지는 브라우저 음성</div>';
}
function snapshot(){
  const p={};                                   // 아직 안 배운 단어는 빼서 파일을 작게
  Object.keys(S.p).forEach(k=>{ const v=S.p[k]; if(v.box>0||v.ok>0||v.ng>0) p[k]=v; });
  return JSON.stringify({v:1,p:p,streak:S.streak,last:S.last,xp:S.xp,hist:S.hist});
}
function applySnapshot(t){
  const o=JSON.parse(t);
  if(!o||typeof o!=="object"||!o.p) throw new Error("bad");
  S.p=Object.assign(S.p,o.p);
  if(o.streak!=null)S.streak=o.streak; if(o.last)S.last=o.last;
  if(o.xp!=null)S.xp=o.xp; if(o.hist)S.hist=Object.assign(S.hist||{},o.hist);
  save();
}
function exportP(){
  const t=snapshot(), d=todayStr().replace(/-/g,"");
  try{
    const url=URL.createObjectURL(new Blob([t],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=CFG.slug+"-"+d+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("진도 파일을 저장했어요");
  }catch(e){ copyP(); }
}
function importFile(inp){
  const f=inp.files&&inp.files[0]; inp.value="";
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ applySnapshot(String(r.result)); toast("진도를 불러왔어요 🎉"); render(); }
                 catch(e){ toast("이 파일은 진도 파일이 아니에요"); } };
  r.onerror=()=>toast("파일을 읽지 못했어요");
  r.readAsText(f);
}
function copyP(){
  const t=snapshot();
  const done=()=>toast("복사했어요. 메모장에 붙여넣어 두세요");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,()=>showText(t));
  } else showText(t);
}
function showText(t){
  const box=document.createElement("div");
  box.className="sheet";
  box.innerHTML='<div class="card" style="max-width:480px;width:100%">'+
    '<h3 style="font-size:15px;margin-bottom:8px">아래 글자를 모두 복사해 두세요</h3>'+
    '<textarea class="dump" readonly></textarea>'+
    '<div style="height:10px"></div><button class="btn sm" id="selall">전체 선택</button>'+
    '<div style="height:8px"></div><button class="btn sec sm" id="closesheet">닫기</button></div>';
  document.body.appendChild(box);
  const ta=box.querySelector("textarea"); ta.value=t;
  box.querySelector("#selall").onclick=()=>{ ta.focus(); ta.setSelectionRange(0,ta.value.length);
    try{document.execCommand("copy");toast("복사했어요");}catch(e){} };
  box.querySelector("#closesheet").onclick=()=>box.remove();
}
function pasteP(){
  const box=document.createElement("div");
  box.className="sheet";
  box.innerHTML='<div class="card" style="max-width:480px;width:100%">'+
    '<h3 style="font-size:15px;margin-bottom:8px">복사해 둔 글자를 붙여넣으세요</h3>'+
    '<textarea class="dump" placeholder="여기에 붙여넣기"></textarea>'+
    '<div style="height:10px"></div><button class="btn sm" id="okpaste">되돌리기</button>'+
    '<div style="height:8px"></div><button class="btn sec sm" id="closesheet">닫기</button></div>';
  document.body.appendChild(box);
  box.querySelector("#okpaste").onclick=()=>{
    try{ applySnapshot(box.querySelector("textarea").value.trim());
         box.remove(); toast("진도를 되돌렸어요 🎉"); render(); }
    catch(e){ toast("글자가 올바르지 않아요"); } };
  box.querySelector("#closesheet").onclick=()=>box.remove();
}

/* ---------- boot ---------- */
load();
document.getElementById("app").innerHTML=
  '<div style="min-height:78vh;display:flex;flex-direction:column;justify-content:center;text-align:center">'+
  mascot(150,"hop")+
  '<h1 style="font-size:29px;margin:10px 0 4px">'+CFG.name+' Spelling Bee</h1>'+
  '<div class="muted">'+CFG.sub+'</div>'+
  '<div style="height:14px"></div>'+
  '<div><span class="brand">'+logoFull(118)+'</span></div>'+
  '<div style="height:26px"></div><button class="btn" id="go">시작하기</button>'+
  '<div class="muted" style="margin-top:14px">1차 D-'+dday(D1)+' · 결선 D-'+dday(D2)+'</div></div>';
document.getElementById("go").onclick=()=>{ try{ ttsSay(" "); }catch(e){} render(); };

/* 오프라인 준비 — 주소로 열었을 때만 동작 (파일로 열면 그냥 넘어감) */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
